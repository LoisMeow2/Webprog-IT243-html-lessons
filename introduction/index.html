<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Personal profile of Lois Vera Cruz - Creative Soul, Tech Enthusiast, Pokemon Lover">
  <link rel="stylesheet" href="css/rwd.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <title>Lois Vera Cruz - Personal Profile</title>
</head>
<body>
  <div id="app">
    <header class="profile-header">
      <div class="header-content">
        <img src="https://www.serebii.net/rumblerush/pokemon/357.png" alt="Profile Picture" class="profile-pic">
        <div class="header-text">
          <h1>{{ profile.name }}</h1>
          <p>{{ profile.tagline }}</p>
        </div>
      </div>
    </header>

    <section class="about">
      <h2>About Me</h2>
      <p>{{ profile.about }}</p>
    </section>

    <section class="education">
      <h2>Education & Achievements</h2>
      <p>{{ profile.education }}</p>
    </section>

    <section class="experience">
      <h2>IT Experience</h2>
      <p>{{ profile.experience }}</p>
    </section>

    <section class="hobbies">
      <h2>Hobbies & Interests</h2>
      <p>{{ profile.hobbies }}</p>
    </section>

    <section class="goals">
      <h2>Goals in Life</h2>
      <p>{{ profile.goals }}</p>
    </section>

    <picture-gallery :images="galleryImages"></picture-gallery>

    <footer class="site-footer">
      <p>&copy; 2026 Lois Vera Cruz. All rights reserved.</p>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
  <script>
    Vue.component('picture-gallery', {
      props: ['images'],
      template: `
        <section class="gallery">
          <h2>Picture Gallery</h2>
          <div class="gallery-grid">
            <img v-for="image in images" :key="image.id" :src="image.src" :alt="image.alt" class="gallery-image">
          </div>
        </section>
      `
    });

    new Vue({
      el: '#app',
      data: {
        profile: {
          name: 'Lois Vera Cruz',
          tagline: 'Creative Soul | Tech Enthusiast | Pokemon Lover',
          about: 'Welcome to my personal space! I\'m passionate about art, technology, and all things creative.',
          education: 'BSIT at APC (Assumption College of Davao)',
          experience: 'Programmer (2024)',
          hobbies: 'Drawing, playing competitive games like Tekken, Pokemon, Splatoon, Overwatch, Valorant',
          goals: 'To keep drawing and bring more stories to life'
        },
        galleryImages: [
          { id: 1, src: 'https://www.serebii.net/rumblerush/pokemon/357.png', alt: 'Tropius' },
          { id: 2, src: 'https://i0.wp.com/sourcegaming.info/wp-content/uploads/2023/02/Tropius-Pokemon-Trading-Card-Game-Kagemaru-Himeno-art.png?resize=500%2C311', alt: 'Tropius Art' },
          { id: 3, src: 'https://assets.pokemon.com/assets/cms2/img/pokedex/full/357.png', alt: 'Tropius Pokedex' },
          { id: 4, src: 'https://static.wikia.nocookie.net/pokemon/images/7/7c/Tropius_anime.png', alt: 'Tropius Anime' },
          { id: 5, src: 'https://www.serebii.net/scarletviolet/pokemon/357.png', alt: 'Tropius Scarlet Violet' },
          { id: 6, src: 'https://archives.bulbagarden.net/media/upload/thumb/7/7c/357Tropius.png/1200px-357Tropius.png', alt: 'Tropius Sprite' }
        ]
      }
    });
  </script>
</body>
</html>
