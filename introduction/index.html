<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Personal profile of Lois Vera Cruz - Creative Soul, Tech Enthusiast, Pokemon Lover">
  <link rel="stylesheet" href="css/rwd.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <title>Lois Vera Cruz - Personal Profile</title>
</head>
<body>
  <div id="app">
    <header class="profile-header">
      <div class="header-content">
        <img src="https://www.serebii.net/rumblerush/pokemon/357.png" alt="Profile Picture" class="profile-pic">
        <div class="header-text">
          <h1>{{ profile.name }}</h1>
          <p>{{ profile.tagline }}</p>
        </div>
      </div>
    </header>

    <section class="about">
      <h2>About Me</h2>
      <p>{{ profile.about }}</p>
      <img src="https://png.pngtree.com/png-vector/20240708/ourmid/pngtree-golden-star-with-shine-png-image_13035142.png" alt="Star" class="decal star" draggable="true">
    </section>

    <section class="education">
      <h2>Education & Achievements</h2>
      <p>{{ profile.education }}</p>
      <img src="https://png.pngtree.com/png-vector/20240708/ourmid/pngtree-golden-star-with-shine-png-image_13035142.png" alt="Star" class="decal star" draggable="true">
    </section>

    <section class="experience">
      <h2>IT Experience</h2>
      <p>{{ profile.experience }}</p>
      <img src="https://png.pngtree.com/png-vector/20240708/ourmid/pngtree-golden-star-with-shine-png-image_13035142.png" alt="Star" class="decal star" draggable="true">
    </section>

    <section class="hobbies">
      <h2>Hobbies & Interests</h2>
      <p>{{ profile.hobbies }}</p>
      <img src="https://png.pngtree.com/png-vector/20240708/ourmid/pngtree-golden-star-with-shine-png-image_13035142.png" alt="Star" class="decal star" draggable="true">
    </section>

    <section class="goals">
      <h2>Goals in Life</h2>
      <p>{{ profile.goals }}</p>
      <img src="https://png.pngtree.com/png-vector/20251209/ourmid/pngtree-taiyaki-japanese-fish-shaped-cake-isolated-on-transparent-png-image_18178924.webp" alt="Taiyaki" class="decal taiyaki" draggable="true">
    </section>

    <picture-gallery :images="galleryImages"></picture-gallery>

    <footer class="site-footer">
      <p>&copy; 2026 Lois Vera Cruz. All rights reserved.</p>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
  <script>
    Vue.component('picture-gallery', {
      props: ['images'],
      template: `
        <section class="gallery">
          <h2>My guys would look like</h2>
          <div class="gallery-grid">
            <img v-for="image in images" :key="image.id" :src="image.src" :alt="image.alt" class="gallery-image">
          </div>
        </section>
      `
    });

    new Vue({
      el: '#app',
      data: {
        profile: {
          name: 'Lois Vera Cruz',
          tagline: 'Creative Meow | Tech Stuff | Pokemon',
          about: 'Welcome to my personal space! Quite the placeholder, but Ill plan something fun soon! I\'m passionate about arts and crafts, technology, and all things creative.',
          education: 'BSIT at APC (Asia Pacific College)',
          experience: 'Programmer (2024)',
          hobbies: 'Drawing, Crafting DIYs, Cloth Design, and playing competitive games like Tekken, Pokemon, Splatoon, Overwatch, Valorant',
          goals: 'To keep drawing and bring more stories to life'
        },
        galleryImages: [
          { id: 1, src: 'https://yoyojapanstore.com/cdn/shop/files/pokemon-center-original-plush-pokemon-fit-tropius-stuffed-animals-558_grande.webp?v=1709680134', alt: 'Tropius' },
          { id: 2, src: 'https://www.pokemoncenter.com/images/DAMRoot/Full-Size/10000/P6975_701-08242_01.jpg', alt: 'Pinchurchin' },
          { id: 3, src: 'https://www.pokemoncenter.com/images/DAMRoot/Full-Size/10021/P9729_701E10606_01.jpg', alt: 'Golisopod' },
          { id: 4, src: 'https://www.pokemoncenter.com/images/DAMRoot/Full-Size/10000/P9440_701-98792_01.jpg', alt: 'Clawitzer' },
          { id: 5, src: 'https://www.pokemoncenter.com/images/DAMRoot/Full-Size/10021/P9729_701E10603_01.jpg', alt: 'Palossand' },
          { id: 6, src: 'https://m.media-amazon.com/images/I/81qv8ouJ13L._AC_UF1000,1000_QL80_.jpg', alt: 'Arcanine' }
        ]
      }
    });

    // Drag and drop for decals
    document.addEventListener('DOMContentLoaded', function() {
      const decals = document.querySelectorAll('.decal');
      decals.forEach(decal => {
        decal.addEventListener('dragstart', function(e) {
          decal.classList.add('dragging');
        });
        decal.addEventListener('dragend', function(e) {
          decal.classList.remove('dragging');
        });
      });

      document.addEventListener('dragover', function(e) {
        e.preventDefault();
      });

      document.addEventListener('drop', function(e) {
        e.preventDefault();
        const decal = document.querySelector('.decal.dragging');
        if (decal) {
          decal.style.position = 'fixed';
          decal.style.left = (e.clientX - decal.offsetWidth / 2) + 'px';
          decal.style.top = (e.clientY - decal.offsetHeight / 2) + 'px';
          decal.style.pointerEvents = 'auto';
        }
      });
    });
  </script>
</body>
</html>
